<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Polices embarquées (aucun téléchargement pendant le rendu) */
@font-face{font-family:"Cairo";font-weight:600;src:url(fonts/cairo-arabic-600-normal.woff2)}
@font-face{font-family:"Cairo";font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2)}
@font-face{font-family:"Cairo";font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2)}
@font-face{font-family:"Cairo";font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2)}
@font-face{font-family:"Amiri";font-weight:400;src:url(fonts/amiri-arabic-400-normal.woff2)}
@font-face{font-family:"Amiri";font-weight:700;src:url(fonts/amiri-arabic-700-normal.woff2)}
@font-face{font-family:"Plex Arabic";font-weight:400;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2)}
@font-face{font-family:"Plex Arabic";font-weight:500;src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2)}
@font-face{font-family:"Plex Arabic";font-weight:600;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:500;src:url(fonts/inter-tight-latin-500-normal.woff2),url(fonts/inter-tight-latin-ext-500-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:700;src:url(fonts/inter-tight-latin-700-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:800;src:url(fonts/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:"Inter Tight";font-weight:900;src:url(fonts/inter-tight-latin-900-normal.woff2)}
@font-face{font-family:"Inter Tight Ext";font-weight:800;src:url(fonts/inter-tight-latin-ext-800-normal.woff2)}
@font-face{font-family:"Inter Tight Ext";font-weight:900;src:url(fonts/inter-tight-latin-ext-900-normal.woff2)}
@font-face{font-family:"Playfair";font-weight:500;src:url(fonts/playfair-display-latin-500-normal.woff2)}
@font-face{font-family:"Playfair";font-weight:700;src:url(fonts/playfair-display-latin-700-normal.woff2)}
@font-face{font-family:"Playfair Ext";font-weight:500;src:url(fonts/playfair-display-latin-ext-500-normal.woff2)}
@font-face{font-family:"JB Mono";font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:"JB Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:"JB Mono";font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#root{position:absolute;inset:0;overflow:hidden;background:var(--deep);
  --f-title:"Inter Tight","Inter Tight Ext","Cairo",sans-serif;
  --f-quote:"Playfair","Playfair Ext","Amiri",serif;
  --f-label:"JB Mono","Plex Arabic",monospace;
  --f-body:"Inter Tight","Inter Tight Ext","Plex Arabic",sans-serif;
  color:var(--ink)}
#root.ar{--f-title:"Cairo","Inter Tight",sans-serif;--f-quote:"Amiri","Playfair",serif;
  --f-label:"Plex Arabic","JB Mono",sans-serif;--f-body:"Plex Arabic","Inter Tight",sans-serif}
.abs{position:absolute;inset:0}
/* ---------- fond vivant : un seul canevas (demi-résolution, agrandi : doux et très rapide à dessiner) ---------- */
#bgc{position:absolute;inset:0;width:100%;height:100%}
/* ---------- scènes ---------- */
#scenes{position:absolute;inset:0;isolation:isolate}   /* les scènes ont leur propre pile : flash, reflets, fondu final et logo restent au-dessus */
.scene{position:absolute;inset:0;visibility:hidden;will-change:transform,opacity,clip-path}
.safe{position:absolute;left:calc(var(--u)*78);right:calc(var(--u)*78);top:var(--safe-top);bottom:calc(var(--safe-bot) + var(--u)*10);
  display:flex;flex-direction:column;justify-content:center}
.v .safe{right:calc(var(--u)*78)}
.kick{font:700 calc(var(--u)*36)/1.3 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ar .kick{letter-spacing:0;font-size:calc(var(--u)*42);font-weight:600}
.ctx{font:500 calc(var(--u)*34)/1.4 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:.82;margin-top:calc(var(--u)*8)}
.ar .ctx{letter-spacing:0;font-size:calc(var(--u)*40)}
.rule{height:calc(var(--u)*5);width:calc(var(--u)*150);background:linear-gradient(90deg,var(--accent),var(--accent2));
  margin:calc(var(--u)*30) 0;transform-origin:var(--start) 50%;border-radius:9px;box-shadow:0 0 calc(var(--u)*24) var(--glow)}
.title{font:900 calc(var(--u)*112)/1.04 var(--f-title);letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance}
.ar .title{letter-spacing:0;line-height:1.28;font-size:calc(var(--u)*104)}
.title.xl{font-size:calc(var(--u)*146)}
.ar .title.xl{font-size:calc(var(--u)*132)}
.title.md{font-size:calc(var(--u)*84)}
.ar .title.md{font-size:calc(var(--u)*80)}
.sub{font:500 calc(var(--u)*52)/1.4 var(--f-body);opacity:.86;margin-top:calc(var(--u)*30);text-wrap:balance}
.w{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.hl{background:linear-gradient(100deg,var(--accent) 10%,#fff 48%,var(--accent2) 86%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 calc(var(--u)*26) var(--glow))}
.src{position:absolute;left:calc(var(--u)*78);right:calc(var(--u)*78);bottom:calc(var(--safe-bot) - var(--u)*64);
  font:500 calc(var(--u)*28)/1.3 var(--f-label);letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.ar .src{letter-spacing:0;font-size:calc(var(--u)*33)}
/* carte verre */
.card{position:relative;border-radius:calc(var(--u)*34);padding:calc(var(--u)*56) calc(var(--u)*54);
  background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
  box-shadow:0 calc(var(--u)*50) calc(var(--u)*120) rgba(0,0,0,.55),inset 0 0 0 calc(var(--u)*2) rgba(255,255,255,.14);
  overflow:hidden;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:calc(var(--u)*3);
  background:linear-gradient(135deg,var(--accent),transparent 35%,transparent 65%,var(--accent2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card .shine{position:absolute;top:-20%;bottom:-20%;width:38%;left:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg)}
.card.paper{background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--paper-ink)}
.card.paper .kick{color:var(--paper-accent)}
.card.paper .hl{background:none;color:var(--paper-accent);filter:none;-webkit-text-fill-color:currentColor}
.persp{perspective:calc(var(--u)*1700)}
.qmark{font:700 calc(var(--u)*230)/.7 var(--f-quote);color:var(--accent);height:calc(var(--u)*120);display:block}
.card.paper .qmark{color:var(--paper-accent)}
.quote{font:500 calc(var(--u)*76)/1.22 var(--f-quote);text-wrap:balance}
.ar .quote{font-weight:700;font-size:calc(var(--u)*80);line-height:1.5}
.who{font:700 calc(var(--u)*38)/1.3 var(--f-title);margin-top:calc(var(--u)*44);text-transform:uppercase;letter-spacing:.02em}
.ar .who{letter-spacing:0;font-size:calc(var(--u)*42)}
.meta{font:500 calc(var(--u)*30)/1.4 var(--f-label);letter-spacing:.1em;text-transform:uppercase;opacity:.66;margin-top:calc(var(--u)*10)}
.ar .meta{letter-spacing:0;font-size:calc(var(--u)*34)}
/* chiffre */
.statwrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:calc(var(--u)*700);height:calc(var(--u)*700);display:grid;place-items:center}
.h .ring{width:calc(var(--u)*520);height:calc(var(--u)*520)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.num{font:900 calc(var(--u)*230)/1 "Inter Tight",var(--f-title);letter-spacing:-.04em;direction:ltr;unicode-bidi:isolate;
  background:linear-gradient(180deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 calc(var(--u)*40) var(--glow))}
.h .num{font-size:calc(var(--u)*170)}
.num small{font-size:.42em;letter-spacing:0;margin:0 .06em}
.lab{font:800 calc(var(--u)*62)/1.25 var(--f-title);text-transform:uppercase;margin-top:calc(var(--u)*46);text-wrap:balance}
.ar .lab{line-height:1.45}
/* frise */
.tl{position:relative;padding-inline-start:calc(var(--u)*70)}
.tl .line{position:absolute;inset-inline-start:calc(var(--u)*9);top:calc(var(--u)*26);bottom:calc(var(--u)*60);width:calc(var(--u)*3);
  background:linear-gradient(180deg,var(--accent),var(--accent2));transform-origin:50% 0;box-shadow:0 0 calc(var(--u)*18) var(--glow)}
.tl .dot{position:absolute;inset-inline-start:calc(var(--u)*-2);width:calc(var(--u)*25);height:calc(var(--u)*25);border-radius:50%;
  background:#fff;box-shadow:0 0 calc(var(--u)*30) calc(var(--u)*8) var(--glow)}
.tl .it{position:relative;margin-bottom:calc(var(--u)*96)}
.tl .it::before{content:"";position:absolute;inset-inline-start:calc(var(--u)*-70);top:calc(var(--u)*30);width:calc(var(--u)*21);height:calc(var(--u)*21);
  border-radius:50%;border:calc(var(--u)*3) solid var(--accent);background:var(--deep)}
.tl .date{font:900 calc(var(--u)*104)/1.1 var(--f-title);letter-spacing:-.02em;text-transform:uppercase}
.ar .tl .date{letter-spacing:0;line-height:1.35;font-size:calc(var(--u)*98)}
.tl .dl{font:500 calc(var(--u)*46)/1.4 var(--f-body);color:var(--accent);margin-top:calc(var(--u)*6)}
/* liste */
.li{padding:calc(var(--u)*40) 0;position:relative}
.li .bar{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*2);background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.12));transform-origin:var(--start) 50%}
.li .nm{font:800 calc(var(--u)*62)/1.2 var(--f-title);text-transform:uppercase;display:flex;align-items:baseline;gap:calc(var(--u)*24)}
.ar .li .nm{line-height:1.45}
.li .ix{font:700 calc(var(--u)*28)/1 "JB Mono",monospace;color:var(--accent);direction:ltr}
.li .rl{font:500 calc(var(--u)*40)/1.4 var(--f-body);color:var(--accent);margin-top:calc(var(--u)*4);padding-inline-start:calc(var(--u)*62)}
/* face à face */
.vs{display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--u)*34)}
.h .vs{flex-direction:row;align-items:center}
.h .vs .blk{flex:1}
.blk{border-radius:calc(var(--u)*28);padding:calc(var(--u)*50) calc(var(--u)*46);text-align:center;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:inset 0 0 0 calc(var(--u)*2) rgba(255,255,255,.16),0 calc(var(--u)*40) calc(var(--u)*90) rgba(0,0,0,.45)}
.blk .bn{font:900 calc(var(--u)*92)/1.1 var(--f-title);text-transform:uppercase;letter-spacing:-.02em;text-wrap:balance}
.ar .blk .bn{letter-spacing:0;line-height:1.4;font-size:calc(var(--u)*84)}
.blk .bs{font:500 calc(var(--u)*42)/1.4 var(--f-body);color:var(--accent);margin-top:calc(var(--u)*8)}
.link{align-self:center;display:grid;place-items:center;width:calc(var(--u)*150);height:calc(var(--u)*150);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--accent),var(--accent2));color:var(--deep);
  font:900 calc(var(--u)*48)/1 "Inter Tight",sans-serif;box-shadow:0 0 calc(var(--u)*70) var(--glow)}
.link svg{width:52%;height:52%}
/* pays */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*26);margin-top:calc(var(--u)*50)}
.h .chips{grid-template-columns:repeat(3,1fr)}
.chip{border-radius:calc(var(--u)*24);overflow:hidden;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 calc(var(--u)*2) rgba(255,255,255,.14);backface-visibility:hidden}
.chip .cols{height:calc(var(--u)*16);display:flex}
.chip .cols i{flex:1}
.chip .cn{font:800 calc(var(--u)*50)/1.3 var(--f-title);padding:calc(var(--u)*30) calc(var(--u)*30) calc(var(--u)*34);text-transform:uppercase}
/* photo */
.photo{position:absolute;inset:0;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(.92)}
.photo .tint{position:absolute;inset:0;background:var(--c1);mix-blend-mode:soft-light;opacity:.75}
.photo .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 26%,transparent 42%,var(--deep) 86%)}
.scene.t-photo .safe{justify-content:flex-end}
/* capture d'écran / document : cadre vitré, recadrage + lent travelling */
.shotrow{display:flex;flex-direction:column;gap:calc(var(--u)*44);margin-top:calc(var(--u)*36)}
.h .shotrow{flex-direction:row;align-items:center;gap:calc(var(--u)*70);margin-top:calc(var(--u)*30)}
.h .shotrow .frame{flex:0 0 54%}
.h .shotrow .shottxt{flex:1;min-width:0}
.frame{position:relative;width:100%;border-radius:calc(var(--u)*30);overflow:hidden;background:#0b0f14;transform-style:preserve-3d;
  box-shadow:0 calc(var(--u)*50) calc(var(--u)*120) rgba(0,0,0,.6),0 0 0 calc(var(--u)*3) rgba(255,255,255,.16),0 0 calc(var(--u)*70) var(--glow)}
.frame img{position:absolute;left:0;top:0;max-width:none;will-change:transform}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 calc(var(--u)*4) var(--accent),inset 0 calc(var(--u)*-90) calc(var(--u)*90) calc(var(--u)*-60) rgba(0,0,0,.55);opacity:.9}
.frame .shine{position:absolute;top:-20%;bottom:-20%;width:38%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg)}
.bigclip .shotrow{margin-top:calc(var(--u)*30)}
.h .bigclip .shotrow{justify-content:center}
.h .bigclip .shotrow .frame{flex:0 0 auto;height:calc(100vh - var(--safe-top) - var(--safe-bot) - var(--u)*90);width:auto}
.live{position:absolute;top:calc(var(--u)*22);inset-inline-start:calc(var(--u)*22);z-index:50;width:calc(var(--u)*30);height:calc(var(--u)*30);display:grid;place-items:center}
.live i{width:100%;height:100%;border-radius:50%;background:#ff3b3b;box-shadow:0 0 calc(var(--u)*22) #ff3b3b}
.frame .shine{z-index:40}
/* fin */
/* ---------- écran de fin de chaîne : rosace géométrique qui se dessine, logo, nom, bouton, cadres « à voir aussi » ---------- */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:var(--safe-top) calc(var(--u)*78) calc(var(--safe-bot) * .75)}
.h .end{flex-direction:row;gap:calc(var(--u)*110);padding:calc(var(--u)*80) calc(var(--u)*150)}
.end .veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,.42) 0%,rgba(0,0,0,.72) 80%)}
.h .end .veil{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.45) 0%,rgba(0,0,0,.72) 85%)}
.brand{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.h .brand{flex:1}
.emblem{position:relative;width:calc(var(--u)*560);height:calc(var(--u)*560);display:grid;place-items:center;margin-bottom:calc(var(--u)*34)}
.h .emblem{width:calc(var(--u)*430);height:calc(var(--u)*430);margin-bottom:calc(var(--u)*22)}
.emblem svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.emblem svg *{fill:none;stroke:var(--accent);vector-effect:non-scaling-stroke}
.emblem .halo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 68%)}
.emblem .lg{position:relative;width:44%;height:44%;border-radius:50%;overflow:hidden;box-shadow:0 calc(var(--u)*24) calc(var(--u)*70) rgba(0,0,0,.6),0 0 0 calc(var(--u)*4) var(--accent),0 0 calc(var(--u)*60) var(--glow)}
.emblem .lg img{width:100%;height:100%;object-fit:cover;display:block}
.logo-free .emblem .lg{border-radius:0;overflow:visible;box-shadow:none}
.logo-free .emblem .lg img{object-fit:contain;filter:drop-shadow(0 calc(var(--u)*18) calc(var(--u)*40) rgba(0,0,0,.6))}
.emblem .lg .shine{position:absolute;top:-20%;bottom:-20%;width:45%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg)}
.emblem .mono{font:900 calc(var(--u)*120)/1 var(--f-title);color:var(--accent)}
.cname{font:900 calc(var(--u)*92)/1.15 var(--f-title);letter-spacing:.01em;text-wrap:balance;max-width:100%}
.ar .cname{line-height:1.4}
.h .cname{font-size:calc(var(--u)*72)}
.end .rule{margin:calc(var(--u)*26) auto;transform-origin:50% 50%;width:calc(var(--u)*220)}
.ctxt{font:600 calc(var(--u)*50)/1.4 var(--f-body);opacity:.92;text-wrap:balance}
.h .ctxt{font-size:calc(var(--u)*40)}
.btn{margin-top:calc(var(--u)*46);padding:calc(var(--u)*26) calc(var(--u)*80);border-radius:999px;
  font:800 calc(var(--u)*50)/1.3 var(--f-title);background:linear-gradient(100deg,var(--accent),var(--accent2));color:var(--deep);
  box-shadow:0 0 calc(var(--u)*70) var(--glow),0 calc(var(--u)*14) calc(var(--u)*40) rgba(0,0,0,.45);position:relative;overflow:hidden}
.h .btn{font-size:calc(var(--u)*40);margin-top:calc(var(--u)*32);padding:calc(var(--u)*20) calc(var(--u)*64)}
.btn .shine{position:absolute;top:-20%;bottom:-20%;width:38%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-18deg)}
.next{position:relative;flex:0 0 calc(var(--u)*640);min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--u)*30);perspective:calc(var(--u)*1600)}
.next .kick{text-align:start}
.slot{position:relative;aspect-ratio:16/9;border-radius:calc(var(--u)*22);background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
  box-shadow:inset 0 0 0 calc(var(--u)*3) var(--accent),0 calc(var(--u)*30) calc(var(--u)*80) rgba(0,0,0,.5),0 0 calc(var(--u)*40) var(--glow);overflow:hidden}
.slot::after{content:"";position:absolute;inset:calc(var(--u)*12);border-radius:calc(var(--u)*14);box-shadow:inset 0 0 0 calc(var(--u)*1.5) rgba(255,255,255,.2)}
.slot .shine{position:absolute;top:-20%;bottom:-20%;width:30%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg)}
#fadeout{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* habillage fixe */
#hud{position:absolute;inset:0;pointer-events:none}
#logo{position:absolute;top:calc(var(--u)*64);inset-inline-end:calc(var(--u)*64);width:calc(var(--u)*128);height:calc(var(--u)*128);object-fit:cover;border-radius:50%;
  box-shadow:0 calc(var(--u)*8) calc(var(--u)*26) rgba(0,0,0,.55),0 0 0 calc(var(--u)*3) rgba(255,255,255,.16)}
#root.logo-free #logo{object-fit:contain;border-radius:0;box-shadow:none;filter:drop-shadow(0 calc(var(--u)*8) calc(var(--u)*22) rgba(0,0,0,.55))}
#root:not(.logo-free) .logoBig img{width:74%;height:74%;object-fit:cover;border-radius:50%}
#prog{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*9);background:rgba(255,255,255,.1)}
#prog i{position:absolute;inset:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:var(--start) 50%;box-shadow:0 0 calc(var(--u)*22) var(--glow)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,var(--accent) 45%,transparent 75%);opacity:0;mix-blend-mode:screen}
#glare{position:absolute;top:-30%;height:160%;width:26%;left:0;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),var(--accent),transparent);filter:blur(calc(var(--u)*26));transform:skewX(-16deg)}
#iris{position:absolute;left:50%;top:45%;border-radius:50%;border:calc(var(--u)*5) solid var(--accent);opacity:0;box-shadow:0 0 calc(var(--u)*60) var(--glow),inset 0 0 calc(var(--u)*60) var(--glow)}
</style>
</head>
<body>
<div id="root">
  <canvas id="bgc"></canvas>
  <div id="scenes"></div>
  <div id="flash"></div><div id="glare"></div><div id="iris"></div>
  <div id="fadeout"></div>
  <div id="hud"><img id="logo" hidden><div id="prog"><i></i></div></div>
</div>
<script>
"use strict";
/* Moteur 100 % déterministe : seek(t) dessine l'image exacte du temps t (aucune animation CSS, aucun hasard non semé). */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));

function words(text,hl,delay=0,step=.07){
  const hs=String(hl||"").split(/\s+/).filter(Boolean).map(x=>x.toLowerCase());
  const strip=w=>w.toLowerCase().replace(/[.,;:!?،؛؟«»"“”()…]/g,"");
  /* Sens d'écriture : chaque mot est un bloc animé. Des mots consécutifs écrits dans l'AUTRE sens que la phrase
     (« Gulf think-tank », « Donald Trump », « 25 % » dans une phrase arabe ; un nom arabe dans une phrase française)
     restent dans UN SEUL bloc — sinon le navigateur inverserait leur ordre. */

    return `<span class="w${isHl?" hl":""}" ${g.f?`dir="${RTL?"ltr":"rtl"}" `:""}data-a="word" data-d="${(delay+i*step).toFixed(3)}">${esc(g.w.join(" "))}</span>`;
  }).join(" ");
}

    let k=1;const kids=[...safe.children];const fits=()=>{const b=safe.getBoundingClientRect();let top=1e9,bot=-1e9,ov=false;
      for(const c of kids){const q=c.getBoundingClientRect();top=Math.min(top,q.top);bot=Math.max(bot,q.bottom);if(q.width>b.width+1)ov=true}
      for(const c of safe.querySelectorAll(".w")){const q=c.getBoundingClientRect();if(q.left<b.left-1||q.right>b.right+1)ov=true}
      return !ov&&(bot-top)<=b.height+1};
    while(!fits()&&k>.45){k-=.05;safe.style.zoom=k}
    s.el.style.visibility="hidden";s.fit=k}
  await seek(0);return{scenes:SC.map(s=>({type:s.sc.type,tr:s.tr,fit:s.fit}))};
};

const OV=.5; /* chevauchement entre deux scènes (s) */
function animate(s,lt,t){
  for(const x of s.an){const n=x.n,st=n.style,d=x.d;let p;
    switch(x.a){
      case"word":p=E.expo(seg(lt,d,d+.6));st.opacity=p;st.transform=`translate3d(0,${(1-p)*.55}em,0) rotate(${(1-p)*(RTL?-4:4)}deg) scale(${.92+.08*p})`;st.filter=p<1?`blur(${(1-p)*14*U}px)`:"";
        if(n.classList.contains("hl"))st.backgroundPosition=`${100-((t*22)%200)}% 0`;break;
      case"rise":p=E.expo(seg(lt,d,d+.6));st.opacity=p;st.transform=`translate3d(0,${(1-p)*46*U}px,0)`;break;
      case"fade":p=seg(lt,d,d+.5);st.opacity=p*.7;break;
      case"draw":p=E.expo(seg(lt,d,d+.7));st.transform=`scaleX(${p})`;break;
      case"drawY":p=E.io(seg(lt,d,d+parseFloat(n.dataset.len)));st.transform=`scaleY(${p})`;break;
      case"travel":{p=E.io(seg(lt,d,d+parseFloat(n.dataset.len)));const par=n.parentElement.getBoundingClientRect().height/ (parseFloat(getComputedStyle(n.closest(".safe")).zoom)||1);
        st.top=(26*U+p*(par-86*U-12*U))+"px";st.transform=`scale(${1+.35*Math.sin(t*7)})`;st.opacity=seg(lt,d,d+.2);break}
      case"pop":p=E.back(seg(lt,d,d+.55));st.opacity=seg(lt,d,d+.2);st.transform=`scale(${.4+.6*p})`;break;
      case"tilt":p=E.expo(seg(lt,d,d+.9));st.opacity=seg(lt,d,d+.3);
        st.transform=`translate3d(0,${(1-p)*120*U}px,0) rotateX(${(1-p)*38+Math.sin(t*.9)*1.6}deg) rotateY(${(1-p)*(RTL?16:-16)+Math.cos(t*.7)*2.2}deg) rotateZ(${(1-p)*-4}deg)`;break;
      case"shine":p=seg(lt,d,d+1.1);st.left=(-45+p*190)+"%";st.opacity=p>0&&p<1?1:0;break;
      case"arc":p=E.io(seg(lt,d,d+1.3));n.setAttribute("stroke-dashoffset",578*(1-p*parseFloat(n.dataset.frac)));break;
      case"spin":n.setAttribute("transform",`rotate(${t*14} 100 100)`);break;
      case"count":{p=E.expo(seg(lt,d,d+1.3));const v=parseFloat(n.dataset.v)*p,dec=+n.dataset.dec;
        n.innerHTML=`${n.dataset.pre?`<small>${n.dataset.pre}</small>`:""}${v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})}${n.dataset.suf?`<small>${n.dataset.suf}</small>`:""}`;break}
      case"slideA":case"slideB":{p=E.expo(seg(lt,d,d+.75));const sgn=x.a==="slideA"?-1:1;st.opacity=seg(lt,d,d+.25);
        st.transform=H>W?`translate3d(${sgn*(1-p)*60}%,0,0) rotateY(${sgn*(1-p)*-35}deg)`:`translate3d(${sgn*(1-p)*(RTL?-60:60)}%,0,0) rotateY(${sgn*(1-p)*-35}deg)`;break}
      case"flip":p=E.expo(seg(lt,d,d+.7));st.opacity=seg(lt,d,d+.2);st.transform=`rotateX(${(1-p)*-88}deg) translate3d(0,${(1-p)*40*U}px,0)`;st.transformOrigin="50% 0";break;
      case"media":{const f=n.parentElement,fw=f.clientWidth,fh=f.clientHeight,iw=+n.dataset.iw||n.naturalWidth,ih=+n.dataset.ih||n.naturalHeight;if(!fw||!iw)break;
        const k=+n.dataset.k,m=+n.dataset.m,T=Math.max(.5,s.sc.span||(s.sc.t1-s.sc.t0)),slot=T/m,ls=lt-k*slot;
        st.opacity=m===1?1:clamp(k===0?1:seg(ls,-.2,.2))*(k===m-1?1:1-seg(ls,slot-.2,slot+.2));st.zIndex=k+1;
        if(ls<-.3||ls>slot+.3){if(m>1)break}
        const [cx,cy,cw,ch]=n.dataset.c.split(",").map(Number),z=Math.max(fw/(cw*iw),fh/(ch*ih)),q=E.io(seg(ls,.3,Math.max(1.2,slot)));
        st.width=iw*z+"px";st.height=ih*z+"px";const ox=cw*iw*z-fw,oy=ch*ih*z-fh,vid=n.dataset.dir;
        st.transform=`translate3d(${-(cx*iw*z)-ox*(ox>oy?(RTL?1-q:q):.5)}px,${-(cy*ih*z)-oy*(oy>=ox?q:.5)}px,0) scale(${vid?1:1.02+.05*q})`;st.transformOrigin=`${(cx+cw/2)*100}% ${(cy+ch/2)*100}%`;
        if(vid){const N=+n.dataset.n,fr=Math.max(1,Math.min(N,Math.floor(Math.max(0,ls)*(+n.dataset.fps))%Math.max(1,s.sc.big?1e9:N)+1)),u=`${vid}/${String(fr).padStart(5,"0")}.jpg`;
          if(n.dataset.cur!==u){n.dataset.cur=u;n.src=u;PENDING.push(n.decode().catch(()=>{}))}}
        break}
      case"veil":st.opacity=E.out(seg(lt,0,.9));break;
      case"sdraw":p=E.io(seg(lt,d,d+parseFloat(n.dataset.len)));n.setAttribute("stroke-dashoffset",(1-p).toFixed(4));break;
      case"rot":n.setAttribute("transform",`rotate(${(lt*parseFloat(n.dataset.v)).toFixed(3)} 100 100)`);break;
      case"breath":st.opacity=E.out(seg(lt,.3,1.6))*(.75+.25*Math.sin(lt*1.3));st.transform=`scale(${1+.06*Math.sin(lt*1.3)})`;break;
      case"loopshine":{const q=lt<d?-1:((lt-d)%4.2)/1.2;st.left=(-50+q*200)+"%";st.opacity=q>=0&&q<=1?1:0;break}
      case"pulse":st.opacity=.35+.65*(.5+.5*Math.sin(t*5));break;
      case"kb":{const q=seg(lt,0,s.sc.t1-s.sc.t0+OV);st.transform=`scale(${1.08+.14*q}) translate3d(${(q-.5)*-3}%,${(q-.5)*-2}%,0)`;break}
      case"ringOut":{const q=((lt-d)%1.8)/1.8;const on=lt>d;st.opacity=on?(1-q)*.8:0;st.transform=`scale(${1+q*.75})`;break}
      case"press":{p=E.back(seg(lt,d,d+.5));const hit=Math.exp(-Math.pow((lt-d-1.1)/.09,2));st.opacity=seg(lt,d,d+.2);st.transform=`scale(${(.6+.4*p)*(1-.08*hit)})`;break}
    }}
}
window.seek=function(t){
  t=clamp(t,0,total);PENDING=[];
  drawBg(t);
  /* scènes */
  let flash=0,glare=null,iris=null;
  SC.forEach((s,i)=>{const {t0,t1}=s.sc,el=s.el,st=el.style,nx=SC[i+1];
    const end=nx?t1+OV:t1+.01;
    if(t<t0||t>end){st.visibility="hidden";return}
    st.visibility="visible";st.zIndex=i+1;const lt=t-t0,la=lt+(s.sc.offset||0);
    let tf="",op=1,clip="",mask="",fl="";
    const pin=seg(lt,0,.6),e=E.expo(pin);
    if(pin<1)switch(s.tr){
      case"open":op=seg(lt,0,.35);tf=`scale(${1.12-.12*e})`;break;
      case"cut":op=seg(lt,0,.3);break;
      case"zoom":op=seg(lt,0,.3);tf=`scale(${.82+.18*e})`;fl=`blur(${(1-e)*18*U}px)`;flash=Math.max(flash,Math.sin(pin*Math.PI)*.22);break;
      case"glare":{const q=E.io(pin),x=RTL?100-q*130:-30+q*130;clip=RTL?`polygon(${x+14}% 0,100% 0,100% 100%,${x-14}% 100%)`:`polygon(0 0,${x+14}% 0,${x-14}% 100%,0 100%)`;glare={x,o:Math.sin(pin*Math.PI)};break}
      case"iris":{const q=E.io(pin)*135;clip=`circle(${q}% at 50% 45%)`;iris={r:q,o:Math.sin(pin*Math.PI)};break}
      case"push":tf=`translate3d(0,${(1-e)*100}%,0)`;fl=`blur(${Math.sin(pin*Math.PI)*8*U}px)`;break;
      case"blinds":{const q=E.io(pin)*12.6;mask=`repeating-linear-gradient(${RTL?270:90}deg,#000 0 ${q}%,transparent ${q}% 12.5%)`;flash=Math.max(flash,Math.sin(pin*Math.PI)*.12);break}
    }
    if(nx&&t>t1){const po=seg(t,t1,t1+OV),eo=E.in(po);
      switch(nx.tr){case"zoom":tf=`scale(${1+.35*eo})`;op=1-po;fl=`blur(${eo*22*U}px)`;break;
        case"push":tf=`translate3d(0,${-eo*100}%,0)`;fl=`blur(${Math.sin(po*Math.PI)*8*U}px)`;break;
        default:tf=`scale(${1-.05*eo})`;op=1-.55*eo;fl=`blur(${eo*10*U}px)`}}
    /* respiration lente de la scène (jamais figée) */
    if(!tf)tf=`scale(${1+.018*seg(la,0,s.sc.span||(t1-t0))})`;
    st.transform=tf;st.opacity=op;st.clipPath=clip||"none";st.webkitMaskImage=st.maskImage=mask||"none";st.filter=fl||"none";
    animate(s,la,t);
  });
  document.getElementById("flash").style.opacity=flash;
  const gl=document.getElementById("glare");if(glare){gl.style.opacity=glare.o;gl.style.left=(glare.x-13)+"%"}else gl.style.opacity=0;
  const ir=document.getElementById("iris");if(iris){const d=iris.r/100*Math.hypot(W,H)*2*.72;ir.style.width=ir.style.height=d+"px";ir.style.marginLeft=ir.style.marginTop=(-d/2)+"px";ir.style.opacity=iris.o}else ir.style.opacity=0;
  document.querySelector("#prog i").style.transform=`scaleX(${t/total})`;
  const lg=document.getElementById("logo");if(!lg.hidden){const last=SC[SC.length-1];const hide=last&&last.sc.type==="outro"?seg(t,last.sc.t0-.2,last.sc.t0+.3):0;lg.style.opacity=E.out(seg(t,.3,1))*(1-hide);lg.style.transform=`scale(${.7+.3*E.back(seg(t,.3,1))})`}
  {const last=SC[SC.length-1];document.getElementById("fadeout").style.opacity=last&&last.sc.type==="outro"&&Math.abs(last.sc.t1-total)<.05?E.in(seg(t,total-.7,total-.05)):0}
  return PENDING.length?Promise.all(PENDING).then(()=>1):1;
};
