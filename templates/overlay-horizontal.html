<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Journal du NON — Overlay OBS (Horizontal)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --void:#05070c; --panel2:#111a2c; --blood:#c81324; --blood-dark:#5e0b13;
    --amber:#f2a900; --cyan:#35e5ff; --bone:#f3efe4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Barlow Semi Condensed',sans-serif;}

  #stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;overflow:hidden;}

  .locbadge{position:absolute;top:24px;left:38px;display:flex;flex-direction:column;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)); animation:badgeIn .7s cubic-bezier(.2,.9,.2,1) both;}
  @keyframes badgeIn{from{opacity:0;transform:translateX(-30px) skewX(-6deg);}to{opacity:1;transform:translateX(0) skewX(0);}}
  .locbadge .tag{background:var(--panel2);color:var(--cyan);font-family:'Space Mono',monospace;font-weight:700;
    font-size:22px;letter-spacing:.14em;padding:5px 19px;border-left:7px solid var(--cyan);}
  .locbadge .place{background:var(--bone);color:var(--void);font-family:'Oswald',sans-serif;font-weight:700;
    font-size:26px;letter-spacing:.03em;padding:5px 19px 5px 27px;display:flex;align-items:center;gap:10px;}
  .locbadge .place::before{content:"";width:0;height:0;border-top:6px solid transparent;
    border-bottom:6px solid transparent;border-left:10px solid var(--blood);}

  .cluster{position:absolute;left:0;bottom:0;width:1920px;animation:riseIn .8s cubic-bezier(.16,.9,.24,1) both;animation-delay:.15s;}
  @keyframes riseIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

  .masthead{position:relative;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(90deg,var(--blood-dark) 0%, #3a0710 100%);padding:10px 38px;
    border-top:2px solid rgba(255,255,255,.08);overflow:hidden;}
  .masthead .brand{display:flex;align-items:baseline;gap:17px;}
  .masthead .brand h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;letter-spacing:.02em;
    color:var(--bone);text-transform:uppercase;}
  .masthead .brand h1 span{color:var(--cyan);}
  .masthead .brand .sub{font-family:'Space Mono',monospace;font-size:19px;color:rgba(243,239,228,.65);
    letter-spacing:.12em;text-transform:uppercase;}
  .masthead .rightinfo{display:flex;align-items:center;gap:19px;font-family:'Space Mono',monospace;color:var(--bone);font-size:19px;}
  .livepill{display:flex;align-items:center;gap:10px;background:var(--blood);padding:4px 17px;
    border-radius:100px;font-weight:700;letter-spacing:.1em;}
  .livepill .dot{width:13px;height:13px;border-radius:50%;background:var(--bone);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .clock{opacity:.9;min-width:100px;text-align:center;}

  .scanline{position:absolute;top:0;left:0;height:100%;width:269px;pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(53,229,255,.14), transparent);
    animation:scan 6s linear infinite;mix-blend-mode:screen;}
  @keyframes scan{from{transform:translateX(-380px);}to{transform:translateX(2100px);}}
  .basepairs{position:absolute;bottom:4px;left:0;width:100%;font-family:'Space Mono',monospace;
    font-size:12px;letter-spacing:.4em;color:rgba(53,229,255,.22);white-space:nowrap;overflow:hidden;pointer-events:none;}

  .tickerbar{position:relative;background:linear-gradient(180deg,#e21c2b 0%, var(--blood) 55%, #92101c 100%);
    display:flex;align-items:stretch;height:71px;
    box-shadow:0 -2px 0 rgba(255,255,255,.15) inset, 0 10px 22px rgba(0,0,0,.5);overflow:hidden;}
  .cat{display:flex;align-items:center;justify-content:center;background:var(--void);color:var(--amber);
    font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;
    padding:0 31px;border-right:5px solid rgba(255,255,255,.15);white-space:nowrap;position:relative;z-index:3;}
  .cat::after{content:"";position:absolute;right:-21px;top:0;bottom:0;width:23px;background:var(--void);transform:skewX(-18deg);}

  .stage-inner{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;}
  .accroche{position:absolute;inset:0;display:flex;align-items:center;padding-left:35px;
    clip-path:polygon(0 0,0 0,0 100%,0 100%);}
  .accroche.run{animation:wipe 8s cubic-bezier(.65,0,.2,1) infinite;}
  @keyframes wipe{
    0%{clip-path:polygon(0 0,0 0,0 100%,0 100%);opacity:0;}
    6%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);opacity:1;}
    88%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);opacity:1;}
    96%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);opacity:1;}
    100%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);opacity:0;}
  }
  .accroche .src{font-family:'Space Mono',monospace;font-weight:700;color:var(--void);background:var(--amber);
    font-size:18px;letter-spacing:.08em;padding:4px 15px;margin-right:21px;white-space:nowrap;flex-shrink:0;}
  .accroche .txt{font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;letter-spacing:.01em;
    color:var(--bone);text-transform:uppercase;white-space:nowrap;text-shadow:0 0 12px rgba(53,229,255,.3);}
  .accroche.glitch .txt{animation:glitchtxt .3s steps(2) 1 .35s;}
  @keyframes glitchtxt{
    0%{transform:translate(0,0);text-shadow:2px 0 var(--cyan), -2px 0 var(--blood);}
    50%{transform:translate(-2px,1px);text-shadow:-2px 0 var(--cyan), 2px 0 var(--blood);}
    100%{transform:translate(0,0);text-shadow:0 0 12px rgba(53,229,255,.3);}
  }

  .badgejdn{display:flex;align-items:center;gap:13px;background:var(--void);padding:0 31px;
    border-left:5px solid rgba(255,255,255,.15);position:relative;z-index:3;}
  .logowrap{width:60px;height:60px;border-radius:50%;border:3.5px solid var(--cyan);display:flex;
    align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:var(--void);
    animation:ringpulse 2.4s ease-in-out infinite, spin30 30s cubic-bezier(.34,1.56,.64,1) infinite;}
  .logowrap img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes ringpulse{0%,100%{box-shadow:0 0 0 0 rgba(53,229,255,.35);}50%{box-shadow:0 0 0 11px rgba(53,229,255,0);}}
  @keyframes spin30{
    0%{transform:rotate(0deg) scale(1);}
    4%{transform:rotate(200deg) scale(1.18);}
    8%{transform:rotate(360deg) scale(1);}
    100%{transform:rotate(360deg) scale(1);}
  }
  .badgejdn .lbl{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;color:var(--bone);line-height:1.05;}
  .badgejdn .lbl b{display:block;color:var(--cyan);letter-spacing:.08em;}

  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:6;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.4) 0 1px, transparent 1px 3px);}
</style>
</head>
<body>
<div id="stage">
  <div class="locbadge">
    <div class="tag">EN DIRECT</div>
    <div class="place">__LOCATION__</div>
  </div>

  <div class="cluster">
    <div class="masthead">
      <div class="scanline"></div>
      <div class="basepairs" id="basepairs"></div>
      <div class="brand">
        <h1>__CHANNEL_LINE1__ <span>__CHANNEL_LINE2__</span></h1>
        <div class="sub">__SUBTITLE__</div>
      </div>
      <div class="rightinfo">
        <div class="livepill"><span class="dot"></span>LIVE</div>
        <div class="clock" id="clock">00:00:00</div>
      </div>
    </div>

    <div class="tickerbar">
      <div class="cat" id="cat">INFO</div>
      <div class="stage-inner">
        <div class="accroche run glitch" id="accroche">
          <div class="src" id="src"></div>
          <div class="txt" id="txt"></div>
        </div>
      </div>
      <div class="badgejdn">
        <div class="logowrap"><img src="data:image/png;base64,__LOGO_B64__" alt="logo"></div>
        <div class="lbl">NEWS<b>LIVE</b></div>
      </div>
    </div>
  </div>
  <div class="grain"></div>
</div>

<script>
  function fitStage(){
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    const offX = (window.innerWidth - 1920*scale)/2;
    const offY = (window.innerHeight - 1080*scale)/2;
    stage.style.transform = `translate(${offX}px, ${offY}px) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  const liveStart = Date.now();
  function tick(){
    const totalSec = Math.floor((Date.now() - liveStart) / 1000);
    const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
    const p = n => String(n).padStart(2,'0');
    document.getElementById('clock').textContent = `${p(h)}:${p(m)}:${p(s)}`;
  }
  setInterval(tick,1000); tick();

  document.getElementById('basepairs').textContent = Array(40).fill("A T C G").join("   ");

  const items = __ITEMS_JSON__;

  let i = 0;
  const catEl = document.getElementById('cat'), srcEl = document.getElementById('src'),
        txtEl = document.getElementById('txt'), accEl = document.getElementById('accroche');

  function nextAccroche(){
    if (items.length === 0) return;
    i = (i+1) % items.length;
    const it = items[i];
    accEl.classList.remove('run','glitch');
    void accEl.offsetWidth;
    catEl.textContent = it.c; srcEl.textContent = it.s; txtEl.textContent = it.t;
    accEl.classList.add('run','glitch');
  }
  if (items.length > 0) {
    catEl.textContent = items[0].c; srcEl.textContent = items[0].s; txtEl.textContent = items[0].t;
  }
  setInterval(nextAccroche, __INTERVAL_MS__);
</script>
</body>
</html>
