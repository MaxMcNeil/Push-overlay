name: Build Overlay

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "input/logo.png"
  release:
    types: [published, edited]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-overlay
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg, cmake, build tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake build-essential

      - name: Install dependencies
        run: npm install

      # La vidéo n'est PAS commitée dans le dépôt (limite de 100 Mo par fichier
      # sur git). Elle vit dans la dernière Release GitHub (jusqu'à 2 Go/fichier)
      # et est simplement téléchargée ici, dans un dossier ignoré par git.
      # Le nom du fichier joint n'a AUCUNE importance : on repère tout seul
      # l'attachment qui a une extension vidéo, quel que soit son nom.
      - name: Télécharger la vidéo depuis la dernière Release (si présente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          ASSET_NAME=$(gh release view --repo "${{ github.repository }}" --json assets \
            -q '.assets[].name' 2>/dev/null | grep -Ei '\.(mp4|mov|mkv|webm|avi|m4v)$' | head -n1 || true)

          if [ -n "$ASSET_NAME" ]; then
            echo "Vidéo détectée dans la dernière release: $ASSET_NAME"
            gh release download --repo "${{ github.repository }}" --pattern "$ASSET_NAME" --dir input --clobber
            EXT="${ASSET_NAME##*.}"
            mv "input/$ASSET_NAME" "input/video.$EXT"
            echo "Renommée en input/video.$EXT pour le pipeline."
          else
            echo "Aucun fichier vidéo trouvé dans la dernière release — le pipeline continuera sans vidéo (texte seul)."
          fi

      # whisper.cpp est compilé nous-mêmes (CMake) et mis en cache, plutôt que de
      # passer par le wrapper npm "nodejs-whisper" qui est cassé avec les versions
      # récentes de whisper.cpp (binaire "main" renommé "whisper-cli", son propre
      # appel à `make` échoue même quand la vraie compilation CMake a réussi).
      - name: Cache whisper.cpp (build + modèle)
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper.cpp
          key: whispercpp-build-v1-${{ runner.os }}

      - name: Compiler whisper.cpp (si pas en cache)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release
          cd whisper.cpp && bash models/download-ggml-model.sh base

      - name: Vérifier que le modèle whisper est présent (même si le cache a été touché)
        run: |
          if [ ! -f whisper.cpp/models/ggml-base.bin ]; then
            cd whisper.cpp && bash models/download-ggml-model.sh base
          fi

      # llama.cpp est compilé nous-mêmes (CMake) et mis en cache, comme
      # whisper.cpp, pour faire tourner un petit LLM local (Qwen2.5-1.5B
      # Instruct, quantisé ~1.1 Go) qui reformule les headlines façon
      # newsroom. Aucune clé API, aucun service payant — tout tourne sur ce
      # runner. Si ce step échoue ou que le modèle est absent, le script de
      # génération retombe automatiquement sur le nettoyage heuristique.
      - name: Cache llama.cpp (build + modèle)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llamacpp-qwen25-1_5b-v1-${{ runner.os }}

      - name: Compiler llama.cpp et télécharger le modèle Qwen (si pas en cache)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build -j"$(nproc)" --config Release --target llama-cli
          mkdir -p llama.cpp/models
          curl -L --fail -o llama.cpp/models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

      - name: Vérifier que le binaire et le modèle llama sont présents (même si le cache a été touché)
        run: |
          mkdir -p llama.cpp/build/bin llama.cpp/models
          if [ ! -f llama.cpp/build/bin/llama-cli ]; then
            echo "llama-cli absent après restauration du cache — sera géré en repli par generate-headlines.mjs."
          fi
          if [ ! -f llama.cpp/models/qwen2.5-1.5b-instruct-q4_k_m.gguf ]; then
            curl -L --fail -o llama.cpp/models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
              "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" || \
              echo "Téléchargement du modèle Qwen échoué — sera géré en repli par generate-headlines.mjs."
          fi

      - name: Transcription locale (si pas de content/script.txt)
        run: node scripts/transcribe.mjs
        timeout-minutes: 25

      - name: Génération des headlines (LLM local, repli heuristique si indispo)
        run: node scripts/generate-headlines.mjs
        timeout-minutes: 10

      - name: Génération de l'overlay (orientation auto)
        run: node scripts/generate-overlay.mjs

      - name: Commit docs/index.html
        run: |
          git config user.name "overlay-bot"
          git config user.email "overlay-bot@users.noreply.github.com"
          git add docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: overlay auto-généré [skip ci]"
          # Si une autre commande (push manuel, autre run) a mis à jour main entre le
          # checkout et ce push, on rebase notre commit par-dessus avant de retenter,
          # au lieu d'échouer avec "rejected (fetch first)".
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push rejeté, tentative de rebase sur origin/main (essai $i)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
