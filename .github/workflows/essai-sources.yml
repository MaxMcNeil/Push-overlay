name: essai sources (temporaire)
on:
  push:
    branches: [sources-monde]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: |
          node scripts/warroom/collect.mjs
          node -e '
          const a = require("./output/warroom/autres.json"); const c = {}; for (const x of a) c[x.source] = (c[x.source] || 0) + 1;
          console.log("AUTRES LECTURES par source :"); for (const [k, v] of Object.entries(c).sort((x, y) => y[1] - x[1])) console.log("  " + v + "  " + k);
          const b = require("./output/warroom/brut.json").filter((x) => x.origine === "declaration");
          console.log("DÉCLARATIONS :", b.length); for (const x of b.slice(0, 6)) console.log("  - " + x.date + " " + x.titre.slice(0, 160));'
