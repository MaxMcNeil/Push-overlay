name: War Room du jour

# Lancement À LA MAIN uniquement (aucun déclenchement automatique).
# 1) ratisse l'actu mondiale des dernières 24 h (presse, cyber, catastrophes, rumeurs), garde le plus choc et le plus solide
# 2) écrit le script du live (prompteur avec repères « ▶ DOSSIER n »)
# 3) fabrique les écrans OBS : une boucle animée par dossier + la transition « ALERTE » (fond transparent)
# 4) publie tout sur une release « out-warroom-… » (jamais lue par les autres workflows)
on:
  workflow_dispatch:
    inputs:
      seuil:
        description: "Niveau de choc minimum d'un sujet (0 à 10)"
        type: choice
        options: ["6", "5", "7", "8"]
        default: "6"
      sujets:
        description: "Sujets à inclure absolument (facultatif ; un par ligne ou séparés par « ; »), ex. : Trump piratage FBI"
        type: string
        default: ""
      max_dossiers:
        description: "Nombre maximum de dossiers"
        type: choice
        options: ["15", "10", "25", "35"]
        default: "15"
      radios:
        description: "📻 Radios et émissions hors système (facultatif, +20 à 40 min) ▸ non = comme avant ▸ oui = la War Room écoute aussi les dernières émissions de médias indépendants (FR, EN, arabe : podcasts des 72 h + radios en direct pendant 20 min), les transcrit gratuitement (sans quota IA) et ajoute leurs passages les plus alarmants aux sujets, toujours attribués (« selon l'émission X »), + les vidéos YouTube déposées par l'agent Termux de ton téléphone. Une info dite seulement dans ces émissions peut faire un dossier (au plus 3, annoncés « NON CONFIRMÉ »). Liste modifiable : scripts/warroom/ecoute/catalogue.md"
        type: choice
        options: ["non", "oui"]
        default: "non"
      emissions_plus:
        description: "📻 Émissions en plus à écouter (facultatif, si Radios = oui) : noms ou liens de flux, séparés par « ; », ex. : Thinkerview ; en: The Duran"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: warroom
  cancel-in-progress: false

env:
  # CLÉS DÉDIÉES à la War Room (facultatives) : secrets WARROOM_GEMINI_API_KEY et WARROOM_GROQ_API_KEY (une ou plusieurs clés,
  # séparées par des virgules). Si une clé dédiée existe, c'est la SEULE utilisée ici pour ce fournisseur : les quotas de Faceless,
  # Build Video et des Shorts ne sont jamais entamés. Sans clé dédiée : les clés de Faceless, sinon celles du dépôt.
  GEMINI_API_KEY: ${{ secrets.WARROOM_GEMINI_API_KEY || secrets.EXPLAINER_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
  GEMINI_API_KEYS: ${{ secrets.WARROOM_GEMINI_API_KEY == '' && secrets.EXPLAINER_GEMINI_API_KEY == '' && secrets.GEMINI_API_KEYS || '' }}
  GEMINI_API_KEYS_PLUS: ${{ secrets.WARROOM_GEMINI_API_KEY == '' && secrets.EXPLAINER_GEMINI_API_KEY == '' && secrets.GEMINI_API_KEYS_PLUS || '' }}
  GROQ_API_KEY: ${{ secrets.WARROOM_GROQ_API_KEY || secrets.EXPLAINER_GROQ_API_KEY || secrets.GROQ_API_KEY }}
  CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEYS: ${{ secrets.WARROOM_GROQ_API_KEY == '' && secrets.EXPLAINER_GROQ_API_KEY == '' && secrets.GROQ_API_KEYS || '' }}
  GROQ_API_KEYS_PLUS: ${{ secrets.WARROOM_GROQ_API_KEY == '' && secrets.EXPLAINER_GROQ_API_KEY == '' && secrets.GROQ_API_KEYS_PLUS || '' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  WARROOM_SEUIL: ${{ inputs.seuil || '6' }}
  WARROOM_MAX: ${{ inputs.max_dossiers || '15' }}
  WARROOM_SUJETS: ${{ inputs.sujets || '' }}
  WARROOM_BUDGET_MIN: "75"

jobs:
  # 📻 Radios et émissions (seulement si « oui ») : trouver les épisodes, puis les écouter sur plusieurs machines en même temps
  ecoute-plan:
    if: inputs.radios == 'oui'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrice: ${{ steps.p.outputs.matrice }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - id: p
        env:
          ECOUTE_PLUS: ${{ inputs.emissions_plus || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/warroom/ecoute/plan.mjs
      - uses: actions/upload-artifact@v6
        with: { name: ecoute-plan, path: output/warroom/ecoute/plan.json, retention-days: 1 }

  ecoute:
    needs: ecoute-plan
    if: needs.ecoute-plan.outputs.matrice != '[]' && needs.ecoute-plan.outputs.matrice != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lot: ${{ fromJSON(needs.ecoute-plan.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: ecoute-plan, path: output/warroom/ecoute }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-turbo-v1 }
      - name: Outils
        run: |
          # un dépôt tiers du runner en panne (ex. packages.microsoft.com 403) ne doit pas empêcher d'installer ffmpeg
          for i in 1 2 3; do command -v ffmpeg >/dev/null && break; sudo apt-get update -qq || true; sudo apt-get install -y -qq ffmpeg || sleep 10; done
          command -v ffmpeg >/dev/null || echo "::warning::ffmpeg introuvable après 3 essais : les émissions de cette machine seront sautées (le reste de l'édition continue)"
          pip install -q faster-whisper
      - name: Écoute et transcription (gratuit, en local)
        run: python scripts/warroom/ecoute/transcrire.py output/warroom/ecoute/plan.json ${{ matrix.lot }} output/warroom/ecoute/transcriptions
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: "transcription-${{ matrix.lot }}", path: output/warroom/ecoute/transcriptions, retention-days: 1, if-no-files-found: ignore }

  warroom:
    needs: [ecoute-plan, ecoute]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Outils (ffmpeg…) — avec cache
        uses: ./.github/actions/setup-media

      - name: Chrome (préinstallé ; installé seulement s'il manque)
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do [ -x "$c" ] && { echo "Chrome : $c"; exit 0; }; done
          P=$(npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/chrome" | awk '{print $2}' | tail -1)
          [ -x "$P" ] || { echo "::error::Impossible d'installer Chrome"; exit 1; }
          echo "CHROME_PATH=$P" >> "$GITHUB_ENV"

      - name: 📻 Transcriptions des radios et émissions (si Radios = oui)
        if: inputs.radios == 'oui'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with: { pattern: "transcription-*", merge-multiple: true, path: output/warroom/ecoute/transcriptions }

      - name: 📻 Plan d'écoute (pour supprimer ensuite les sons du téléphone écoutés)
        if: inputs.radios == 'oui'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with: { name: ecoute-plan, path: output/warroom/ecoute }

      - name: Collecte de l'actu + écriture du script
        timeout-minutes: 85
        run: node scripts/warroom/ecrire.mjs

      - name: Écrans OBS (boucles par dossier + transition ALERTE)
        timeout-minutes: 55
        run: |
          node scripts/warroom/clips.mjs \
            || { echo "::warning::rendu échoué : nouvel essai avec un seul Chrome"; EXPLAINER_WORKERS=1 node scripts/warroom/clips.mjs; }

      - name: Paquet à télécharger sur le PC
        run: |
          set -euo pipefail
          D=output/warroom
          mkdir -p pub
          cp "$D/prompteur.txt" pub/prompteur.txt
          cp "$D/sources.md" pub/sources.md
          cp "$D/warroom.json" pub/warroom.json
          [ -f "$D/youtube.txt" ] && cp "$D/youtube.txt" pub/youtube.txt || true
          (cd "$D/ecrans" && zip -q -0 "$GITHUB_WORKSPACE/pub/WarRoom-ecrans.zip" *.mp4 *.webm)
          ls -la pub

      - name: 📻 Sons du téléphone écoutés → supprimés définitivement (fichiers puis release temporaire)
        if: success() && inputs.radios == 'oui'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/warroom/ecoute/nettoyer.mjs

      - uses: actions/upload-artifact@v6
        with:
          name: warroom
          path: pub/*
          retention-days: 3

      - name: Publication (release out-warroom-…)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG="out-warroom-$(TZ=Europe/Rome date +%Y%m%d-%H%M)"; else TAG="out-warroom-essai"; fi
          gh release delete "$TAG" --repo "$REPO" -y --cleanup-tag 2>/dev/null || true
          N=$(grep -c '^▶ DOSSIER' pub/prompteur.txt || true)
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "War Room — $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')" \
            --notes "$N dossiers. Télécharge **prompteur.txt** (à charger dans l'appli Prompteur) et **WarRoom-ecrans.zip** (à dézipper dans le dossier War Room du PC). Titre, description et tags YouTube : youtube.txt. Sources : sources.md." \
            pub/prompteur.txt pub/sources.md pub/warroom.json pub/WarRoom-ecrans.zip $( [ -f pub/youtube.txt ] && echo pub/youtube.txt )
          echo "Publié : https://github.com/$REPO/releases/tag/$TAG"
