name: Diagnostic source (temporaire)
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "Run à analyser", required: true }
permissions:
  contents: read
  actions: read
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ inputs.run_id }}" --repo "${{ github.repository }}" --log > log.txt || true
          SRC=$(grep -oE 'Google Drive : fichier [A-Za-z0-9_-]+|Release [^ ]+ — vidéo : .*|Lien direct : [^ ]+' log.txt | head -1)
          INFO=$(grep -E 'Vidéo [0-9]+:[0-9]+ \(|Propositions de passages|Gemini .*(saturé|pas de réponse|REFUSÉE|modèle utilisé|HTTP)|sélection impossible|budget' log.txt | sed 's/^.*Z //' | head -25 | tr '\n' ' | ' | cut -c1-900)
          echo "::notice title=SOURCE::${SRC:-introuvable}"
          echo "::notice title=SELECTION::${INFO:-rien}"
