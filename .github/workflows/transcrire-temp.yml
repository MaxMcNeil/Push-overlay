name: Transcrire audio (temporaire)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - name: Transcrire
        env:
          GROQ: ${{ secrets.EXPLAINER_GROQ_API_KEY || secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git clone -q --depth 1 --branch audio-temp "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" src
          K=$(echo "$GROQ" | tr ',' '\n' | head -1 | tr -d ' ')
          curl -sS https://api.groq.com/openai/v1/audio/transcriptions -H "Authorization: Bearer $K" \
            -F file=@src/a.mp3 -F model=whisper-large-v3 -F language=ar -F response_format=verbose_json -F 'timestamp_granularities[]=word' -F 'timestamp_granularities[]=segment' > t.json
          jq -r '.segments[]|"SEG \(.start) \(.end) \(.text)"' t.json
          jq -c '[.words[]|[.start,.end,.word]]' t.json | sed 's/^/WORDS /'
          git -C src push -q origin --delete audio-temp || true
