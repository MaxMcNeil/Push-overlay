name: Restaurer les médias

# Lancement manuel : recrée la release « Vidéo » (voix + captures + vidéos) à partir de la branche temporaire
# restauration-medias, puis supprime cette branche. Ne fait rien si la branche n'existe pas.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  restaurer:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" restauration-medias >/dev/null \
            || { echo "Rien à restaurer (branche restauration-medias absente)."; exit 0; }
          git clone -q --depth 1 --branch restauration-medias "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" src
          ls -la src/medias
          TAG="Vidéo"; gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && TAG="Vidéo-restaurée"
          gh release create "$TAG" --repo "$REPO" --title "Vidéo" --notes "Voix + captures + vidéos restaurées (copie du 13/11)." src/medias/*
          n=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets|length')
          echo "Release $TAG : $n fichier(s)"; [ "$n" -eq "$(ls src/medias | wc -l)" ]
          git -C src push -q origin --delete restauration-medias && echo "Branche temporaire supprimée."
