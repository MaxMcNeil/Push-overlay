name: Restaurer les médias

# Lancement manuel, usage unique : copie les fichiers de la release « Vidéo » (restaurée) dans la release « Ksa »
# (sans écraser un fichier déjà présent : un nom en double reçoit le préfixe « restaure- »), vérifie, puis supprime
# la release « Vidéo ». Ce fichier de workflow sera ensuite retiré du dépôt.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deplacer:
    runs-on: ubuntu-24.04
    steps:
      - name: Copier Vidéo → Ksa puis supprimer Vidéo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release view "Vidéo" --repo "$REPO" >/dev/null 2>&1 || { echo "Release Vidéo absente : rien à faire."; exit 0; }
          mkdir -p src && gh release download "Vidéo" --repo "$REPO" --dir src
          have=$(gh release view Ksa --repo "$REPO" --json assets -q '.assets[].name')
          for f in src/*; do
            n=$(basename "$f")
            if grep -qxF "$n" <<<"$have"; then mv "$f" "src/restaure-$n"; echo "Nom déjà pris dans Ksa : $n → restaure-$n"; fi
          done
          gh release upload Ksa --repo "$REPO" src/*
          now=$(gh release view Ksa --repo "$REPO" --json assets -q '.assets[].name')
          for f in src/*; do grep -qxF "$(basename "$f")" <<<"$now" || { echo "::error::$(basename "$f") absent de Ksa : Vidéo conservée"; exit 1; }; done
          echo "Ksa : $(wc -l <<<"$now") fichier(s)."
          gh release delete "Vidéo" --repo "$REPO" -y --cleanup-tag && echo "Release Vidéo supprimée."
