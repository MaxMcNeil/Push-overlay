name: Build Video

# Dépose une vidéo dans une Release GitHub -> ce workflow la transcrit, écrit les
# headlines + cartes d'analyse, puis rend la vidéo finale (output/final.mp4).
# Résultat : onglet Actions -> run -> Artifacts, ET Release "renders" (téléchargeable direct).

# Les Releases dont le tag commence par "shorts" sont pour le workflow « Video to Shorts » (ignorées ici).
on:
  release:
    types: [published]          # (plus "edited" : modifier le titre d'une release relançait un rendu complet)
  push:
    branches: [main]
    paths:                      # (plus "scripts/**" : chaque mise à jour du code relançait — et annulait — un rendu)
      - "content/manual-headlines.txt"
      - "input/logo*.png"
  workflow_dispatch:
    inputs:
      release:
        description: "Tag de la release à monter (vide = la plus récente qui contient une vidéo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # une file par release : deux vidéos publiées coup sur coup sont TOUTES LES DEUX rendues (avant : la 1re était annulée)
  group: build-video-${{ github.event.release.tag_name || inputs.release || github.ref }}
  cancel-in-progress: false

env:
  # IA GRATUITE (recommandé) : crée une clé gratuite et ajoute-la comme secret du dépôt.
  #   - GEMINI_API_KEY : clé gratuite Google AI Studio (aistudio.google.com) -> meilleur arabe
  #   - GROQ_API_KEY   : clé gratuite console.groq.com (Llama 3.3 70B, très rapide)
  #   - ANTHROPIC_API_KEY : (payant, optionnel)
  # Ordre d'essai : Gemini -> Groq -> Claude -> LLM local Qwen (gratuit mais bien plus faible, surtout en arabe).
  # Plusieurs clés possibles : secrets GEMINI_API_KEYS / GROQ_API_KEYS (séparées par virgule ou retour à la ligne).
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
  GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
  GROQ_API_KEYS_PLUS: ${{ secrets.GROQ_API_KEYS_PLUS }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  # 1) liste les vidéos de la release (jusqu'à 10) : chacune sera montée par sa propre tâche, EN PARALLÈLE
  lister:
    if: >-
      github.event_name != 'release' || (
        github.event.release.tag_name != 'renders' &&
        !startsWith(github.event.release.tag_name, 'short') &&
        !contains(github.event.release.name, 'short') &&
        !startsWith(github.event.release.tag_name, 'out-'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.l.outputs.tag }}
      videos: ${{ steps.l.outputs.videos }}
      n: ${{ steps.l.outputs.n }}
      lot: ${{ steps.l.outputs.lot }}
    steps:
      - uses: actions/checkout@v5
      - name: Vidéos de la release
        id: l
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WANT_TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          vids() { gh release view "$1" --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -Ei '\.(mp4|mov|mkv|webm|avi|m4v)$' || true; }
          TAG="$WANT_TAG"
          if [ -z "$TAG" ]; then
            # la plus récente release « normale » qui contient une vidéo (on ignore renders, shorts*, out-*)
            shopt -s nocasematch
            for t in $(gh release list --repo "$REPO" --limit 40 --json tagName -q '.[].tagName'); do
              case "$t" in renders|short*|out-*) continue;; esac
              [ -n "$(vids "$t")" ] && { TAG="$t"; break; }
            done
          fi
          vids "$TAG" > /tmp/vids.txt
          N=$(wc -l < /tmp/vids.txt)
          if [ "$N" -eq 0 ]; then
            echo "::error::Aucune vidéo trouvée${TAG:+ dans la release $TAG}. Publie une Release avec ta ou tes vidéos en pièce jointe."
            bash scripts/release-status.sh "$TAG" fail "Aucune vidéo dans cette release (formats acceptés : mp4, mov, mkv, webm, avi, m4v)."
            exit 1
          fi
          if [ "$N" -gt 10 ]; then
            echo "::warning::$N vidéos dans la release : les 10 premières sont montées (dépose les autres dans une autre release)."
            head -n 10 /tmp/vids.txt > /tmp/v10 && mv /tmp/v10 /tmp/vids.txt; N=10
          fi
          echo "Release $TAG — $N vidéo(s) :"; cat /tmp/vids.txt
          {
            echo "tag=$TAG"; echo "n=$N"; echo "lot=$(date -u +%Y%m%d-%H%M)"
            echo "videos=$(jq -R . /tmp/vids.txt | jq -sc 'to_entries | map({i: (.key + 1), name: .value})')"
          } >> "$GITHUB_OUTPUT"
          bash scripts/release-status.sh "$TAG" run "Montage en cours : 0/$N vidéo(s) terminée(s)… [suivre](https://github.com/$REPO/actions/runs/${{ github.run_id }})"

  # 2) une tâche par vidéo, toutes en même temps (musique de fond supprimée, puis montage complet)
  build:
    needs: lister
    name: "Vidéo ${{ matrix.video.i }}/${{ needs.lister.outputs.n }} — ${{ matrix.video.name }}"
    runs-on: ubuntu-24.04   # figé : ubuntu-latest passe à Ubuntu 26 (oct. 2026), non testé
    timeout-minutes: 180
    strategy:
      fail-fast: false        # une vidéo qui échoue n'arrête pas les autres
      max-parallel: 10
      matrix:
        video: ${{ fromJSON(needs.lister.outputs.videos) }}
    env:
      SRC_TAG: ${{ needs.lister.outputs.tag }}
      LOT: ${{ needs.lister.outputs.lot }}
      N: ${{ needs.lister.outputs.n }}
      VIDEO_NAME: ${{ matrix.video.name }}
      VIDEO_I: ${{ matrix.video.i }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Outils (ffmpeg, emoji couleur, Pillow, polices) — avec cache
        uses: ./.github/actions/setup-media
        with:
          build-tools: "true"

      - name: Télécharger la vidéo ${{ matrix.video.i }} de la release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p input
          ID=$(gh api "repos/$REPO/releases/tags/$SRC_TAG" --jq '.assets[] | select(.name == $ENV.VIDEO_NAME) | .id' | head -n1)
          [ -n "$ID" ] || { echo "::error::Vidéo « $VIDEO_NAME » introuvable dans la release $SRC_TAG"; exit 1; }
          EXT="${VIDEO_NAME##*.}"; EXT="${EXT,,}"
          for i in 1 2 3; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$ID" > "input/video.$EXT" && [ -s "input/video.$EXT" ] && break
            echo "téléchargement : nouvel essai"; sleep 10
          done
          echo "ASSET_BASE=$(basename "$VIDEO_NAME" ".${VIDEO_NAME##*.}" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_ENV"
          echo "Vidéo $VIDEO_I/$N : $VIDEO_NAME"
          ffprobe -v error -show_entries stream=codec_type,width,height,duration -of csv=p=0 "input/video.$EXT"

      # ---------- musique de fond : supprimée avant tout le reste (droits d'auteur) ----------
      # Demucs sépare ta voix du reste ; s'il y a de la musique, même 1 seconde, le son de TOUTE la vidéo est remplacé
      # par ta voix seule (image intacte, même synchro). Sans musique : son d'origine gardé. Bibliothèques et modèle en
      # cache (1er lancement ≈ 3-4 min d'installation, ensuite quelques secondes).
      - name: Cache Demucs (séparation voix / musique)
        uses: actions/cache@v5
        with:
          path: |
            ~/demucs-venv
            ~/.cache/torch/hub/checkpoints
          key: demucs-v1-${{ runner.os }}-py312

      - name: Supprimer la musique de fond (droits d'auteur)
        timeout-minutes: 75
        run: |
          if [ ! -x ~/demucs-venv/bin/python ] || ! ~/demucs-venv/bin/python -c "import demucs, torch" 2>/dev/null; then
            rm -rf ~/demucs-venv && python3 -m venv ~/demucs-venv
            for i in 1 2 3; do
              ~/demucs-venv/bin/pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu \
                && ~/demucs-venv/bin/pip install -q demucs==4.0.1 soundfile numpy && break
              echo "installation de Demucs : nouvel essai dans 15 s"; sleep 15
            done
          fi
          V=$(ls input/video.* | head -n1)
          ~/demucs-venv/bin/python scripts/remove-music.py "$V" "$RUNNER_TEMP/music" 2>&1 | grep -v "^+ \|%|" || true
          if python3 -c "import json,sys; j=json.load(open('content/music.json')); sys.exit(0 if j.get('checked') else 1)"; then
            python3 -c "import json; j=json.load(open('content/music.json')); print('### 🎵 Musique de fond : ' + ('détectée → supprimée (voix seule)' if j['replaced'] else 'aucune'))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠ Musique de fond NON vérifiée (Demucs indisponible) : vérifie la vidéo avant de publier" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------- whisper.cpp (transcription locale, mot à mot) ----------
      - name: Cache whisper.cpp
        id: whisper-cache
        uses: actions/cache@v5
        with:
          path: whisper.cpp
          key: whispercpp-build-v4-${{ runner.os }}

      - name: Compiler whisper.cpp (si pas en cache)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release
          cd whisper.cpp
          bash models/download-ggml-model.sh small
          bash models/download-ggml-model.sh large-v3-turbo-q5_0 || echo "modèle turbo indisponible : whisper small sera utilisé"

      - name: Vérifier les modèles whisper
        run: |
          cd whisper.cpp
          [ -f models/ggml-small.bin ] || bash models/download-ggml-model.sh small
          [ -f models/ggml-large-v3-turbo-q5_0.bin ] || bash models/download-ggml-model.sh large-v3-turbo-q5_0 || echo "modèle turbo indisponible"
          ls -la models/*.bin

      # ---------- llama.cpp + Qwen2.5-7B : uniquement si pas de clé Anthropic ----------
      - name: Cache llama.cpp
        if: env.GEMINI_API_KEY == '' && env.GEMINI_API_KEYS == '' && env.GROQ_API_KEY == '' && env.GROQ_API_KEYS == '' && env.ANTHROPIC_API_KEY == ''
        id: llama-cache
        uses: actions/cache@v5
        with:
          path: llama.cpp
          key: llamacpp-qwen25-7b-v1-${{ runner.os }}

      - name: Compiler llama.cpp + télécharger Qwen2.5-7B (si pas en cache)
        if: env.GEMINI_API_KEY == '' && env.GEMINI_API_KEYS == '' && env.GROQ_API_KEY == '' && env.GROQ_API_KEYS == '' && env.ANTHROPIC_API_KEY == '' && steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
          cmake --build llama.cpp/build -j"$(nproc)" --config Release --target llama-server
          mkdir -p llama.cpp/models
          curl -L --fail -o llama.cpp/models/qwen2.5-7b-instruct-q4_k_m.gguf \
            "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"

      # ---------- pipeline ----------
      - name: Transcription (Groq Whisper large-v3 si clé, sinon whisper local turbo)
        run: node scripts/transcribe.mjs
        timeout-minutes: 60

      - name: Scénario (hook, headlines, cartes d'analyse)
        run: node scripts/plan-video.mjs
        timeout-minutes: 45

      - name: Emojis
        run: python3 scripts/make-emoji.py content/plan.json

      - name: Choisir le style (varie d'une vidéo à l'autre, par chaîne)
        continue-on-error: true   # protège le cœur : sans thème, le rendu d'origine est utilisé
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BATCH_SEED: ${{ needs.lister.outputs.lot }}
          BATCH_INDEX: ${{ matrix.video.i }}
        run: |
          mkdir -p state
          git fetch --depth=1 origin "$DEFAULT_BRANCH" || true
          git show "origin/$DEFAULT_BRANCH:state/style-history.json" > state/style-history.json 2>/dev/null || echo '{}' > state/style-history.json
          node scripts/pick-style.mjs
          cp content/style-pick.json "style-pick-$VIDEO_I.json" 2>/dev/null || true

      - name: Rendu vidéo
        run: node scripts/render-video.mjs
        timeout-minutes: 60

      - name: Garder le scénario avec la vidéo
        run: |
          cp content/plan.json output/plan.json
          cp content/theme.json output/theme.json 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        with:
          name: video-finale-${{ matrix.video.i }}
          path: output/
          retention-days: 3

      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: style-${{ matrix.video.i }}
          path: style-pick-${{ matrix.video.i }}.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Publier dans la Release "renders"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view renders --repo "$REPO" >/dev/null 2>&1 || \
            gh release create renders --repo "$REPO" --prerelease --title "🎬 RÉSULTAT — Vidéo montée" --notes "Résultat automatique." || true
          NAME="${LOT}-$(printf %02d "$VIDEO_I")-${ASSET_BASE}.mp4"
          cp output/final.mp4 "$NAME"
          # la release « renders » garde TOUTES les vidéos de ce lot ; seules celles des lots précédents sont retirées
          gh release view renders --repo "$REPO" --json assets -q '.assets[].name' | while read -r a; do
            case "$a" in "$LOT"-*|"") ;; *) gh release delete-asset renders "$a" --repo "$REPO" -y || true;; esac
          done
          for i in 1 2 3; do gh release upload renders "$NAME" --repo "$REPO" --clobber && break; sleep 10; done
          DONE=$(gh release view renders --repo "$REPO" --json assets -q '.assets[].name' | grep -c "^$LOT-" || true)
          [ "$DONE" -lt "$N" ] && bash scripts/release-status.sh "$SRC_TAG" run "Montage en cours : $DONE/$N vidéo(s) terminée(s)… [suivre](https://github.com/$REPO/actions/runs/${{ github.run_id }})"
          echo "### ✅ Vidéo $VIDEO_I/$N prête : release « renders » → $NAME" >> "$GITHUB_STEP_SUMMARY"

  # 3) bilan quand TOUTES les vidéos sont finies : état de ta release, notes de « renders », nettoyage, historique
  terminer:
    needs: [lister, build]
    if: always() && needs.lister.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: style-*
          merge-multiple: true
          path: picks
      - name: Bilan du lot
        id: b
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SRC_TAG: ${{ needs.lister.outputs.tag }}
          LOT: ${{ needs.lister.outputs.lot }}
          N: ${{ needs.lister.outputs.n }}
          VIDEOS: ${{ needs.lister.outputs.videos }}
        run: |
          gh release view renders --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep "^$LOT-" | sort > /tmp/done.txt || true
          DONE=$(wc -l < /tmp/done.txt)
          FAILED=$(jq -r '.[] | "\(.i)\t\(.name)"' <<<"$VIDEOS" | while IFS=$'\t' read -r i name; do
            grep -q "^$LOT-$(printf %02d "$i")-" /tmp/done.txt || echo "$name"; done | paste -sd ',' - | sed 's/,/, /g')
          {
            echo "🎬 **Tes $DONE dernière(s) vidéo(s) montée(s)** (fichiers ci-dessous). Elles sont remplacées au prochain montage."
            echo; sed 's/^/- `/; s/$/`/' /tmp/done.txt; echo
            echo "**Pour monter d'autres vidéos** : Releases → *Draft a new release* → tag \`video-001\` (n'importe quel nom SANS « short ») → joins une ou plusieurs vidéos (10 max, montées en même temps) → *Publish*."
            echo "**Pour les découper en Shorts** : même chose avec un tag qui commence par \`shorts\` (ex. \`shorts-001\`)."
          } > /tmp/renders.md
          [ "$DONE" -gt 0 ] && gh release edit renders --repo "$REPO" --title "🎬 RÉSULTAT — Vidéo(s) montée(s)" --notes-file /tmp/renders.md --prerelease || true
          LINK="[🎬 RÉSULTAT](https://github.com/$REPO/releases/tag/renders)"
          if [ "$DONE" -ge "$N" ]; then
            bash scripts/release-status.sh "$SRC_TAG" ok "$N/$N vidéo(s) montée(s) → release $LINK"
          elif [ "$DONE" -gt 0 ]; then
            bash scripts/release-status.sh "$SRC_TAG" fail "$DONE/$N vidéo(s) montée(s) → $LINK ; échec pour : $FAILED — [voir le détail](https://github.com/$REPO/actions/runs/${{ github.run_id }})"
          else
            bash scripts/release-status.sh "$SRC_TAG" fail "Le montage a échoué : [voir le détail](https://github.com/$REPO/actions/runs/${{ github.run_id }}). Vérifie que les pièces jointes sont bien des vidéos."
          fi
          echo "### $DONE/$N vidéo(s) montée(s)${FAILED:+ — échec : $FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "done=$DONE" >> "$GITHUB_OUTPUT"

      - name: Supprimer les anciennes vidéos déposées (jamais une release encore en cours de montage)
        if: steps.b.outputs.done != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CUR: ${{ needs.lister.outputs.tag }}
        run: |
          # releases d'ENTRÉE de Build Video (pas renders, pas shorts*, pas out-*) : on garde celle qui vient d'être montée
          # et toute release dont le montage est encore EN COURS (titre « ⏳ EN COURS »)
          gh release list --repo "$REPO" --limit 100 --json tagName,name -q '.[] | [.tagName, .name] | @tsv' > /tmp/rels.tsv
          while IFS=$'\t' read -r t name; do
            case "$t" in renders|out-*) continue;; esac
            shopt -s nocasematch; case "$t" in short*) continue;; esac; shopt -u nocasematch
            [ "$t" = "$CUR" ] && continue
            case "$name" in "⏳ EN COURS"*) echo "Gardée (montage en cours) : $t"; continue;; esac
            echo "Suppression de l'ancienne release d'entrée : $t"
            gh release delete "$t" --repo "$REPO" -y --cleanup-tag || true
          done < /tmp/rels.tsv

      - name: Mémoriser les styles utilisés (pour ne pas les répéter trop vite)
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ls picks/*.json >/dev/null 2>&1 || { echo "Aucun style à mémoriser."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for k in 1 2 3; do
            git fetch -q origin "$DEFAULT_BRANCH" && git checkout -q -f -B style-history "origin/$DEFAULT_BRANCH"
            mkdir -p state; [ -f state/style-history.json ] || echo '{}' > state/style-history.json
            node -e '
              const fs = require("fs"); const H = "state/style-history.json"; const h = JSON.parse(fs.readFileSync(H, "utf8"));
              for (const f of fs.readdirSync("picks").sort()) { try { const p = JSON.parse(fs.readFileSync("picks/" + f, "utf8"));
                if (p.channel && p.id) h[p.channel] = [...(h[p.channel] || []), p.id].slice(-12); } catch {} }
              fs.writeFileSync(H, JSON.stringify(h, null, 2) + "\n");'
            git add state/style-history.json
            git diff --cached --quiet && { echo "Historique inchangé."; break; }
            git commit -q -m "chore: historique des styles [skip ci]" && git push -q origin "HEAD:$DEFAULT_BRANCH" && break
            sleep 5
          done
