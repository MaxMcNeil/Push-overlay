name: Video to Shorts

# Vidéo longue → plusieurs Shorts verticaux montés (hook, headlines, cartes, sous-titres, thèmes variés).
#
# SOURCE de la vidéo, au choix :
#   • Release GitHub dont le TAG commence par "shorts" (ex. shorts-001) avec la vidéo en pièce jointe ;
#   • la même Release SANS pièce jointe, avec le lien Google Drive dans sa description (vidéo trop lourde) ;
#   • Actions → Video to Shorts → Run workflow → champ « source » : lien Google Drive, tag de release ou lien direct .mp4.
# RÉSULTATS : chaque short < SHORTS_RELEASE_MAX_MB (1900 Mo) → Release « out-shorts » (remplacée à chaque lancement,
# les anciennes vidéos déposées « shorts… » sont supprimées) ; plus lourd → Google Drive
# (secret RCLONE_CONF requis). Réglable avec le champ « destination ».

on:
  release:
    types: [published]
  # 🔗 CHAÎNE : lancé automatiquement par Montage LV final (après un fond vert avec « enchainer »), jamais par un cron
  repository_dispatch:
    types: [chaine-shorts]
  workflow_dispatch:
    inputs:
      source:
        description: "Lien Google Drive, tag de release, ou lien direct .mp4 (vide = dernière release « shorts… »)"
        required: false
        default: ""
      nombre:
        description: "Nombre de shorts"
        required: false
        default: "5"
      duree_min:
        description: "Durée minimale d'un short (s)"
        required: false
        default: "30"
      duree_max:
        description: "Durée maximale d'un short (s, YouTube accepte jusqu'à 180)"
        required: false
        default: "90"
      recadrage:
        description: "Recadrage d'une vidéo horizontale (auto = 9:16 centré sur le visage)"
        type: choice
        options: [auto, "9:16", "4:5", "1:1", none]
        default: auto
      position:
        description: "Partie gardée au recadrage (center = suit le visage s'il est détecté)"
        type: choice
        options: [center, left, right]
        default: center
      consigne:
        description: "Consigne pour le choix des passages (facultatif, ex. « les moments sur l'économie »)"
        required: false
        default: ""
      destination:
        description: "Où déposer les shorts"
        type: choice
        options: [auto, release, drive, both]
        default: auto

permissions:
  contents: write

concurrency:
  group: shorts-${{ github.event.client_payload.chaine_id || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
  GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
  GROQ_API_KEYS_PLUS: ${{ secrets.GROQ_API_KEYS_PLUS }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  # ------------------------------------------------------------------ 1. source → transcription → sélection → découpe
  select:
    # tag qui commence par « short » ou titre qui contient « short » (majuscules ignorées)
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'short') || contains(github.event.release.name, 'short')
    runs-on: ubuntu-24.04   # figé : ubuntu-latest passe à Ubuntu 26 (oct. 2026), non testé
    timeout-minutes: 300
    outputs:
      matrix: ${{ steps.cut.outputs.matrix }}
      base: ${{ steps.src.outputs.base }}
      src_tag: ${{ steps.src.outputs.tag }}
      lang: ${{ steps.cut.outputs.lang }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Libérer de l'espace disque (vidéos de plusieurs Go)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - name: Outils (ffmpeg…) — avec cache
        uses: ./.github/actions/setup-media
        with:
          build-tools: "true"
          opencv: "true"

      - name: Récupérer la vidéo source (Release, Google Drive ou lien)
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.source || github.event.client_payload.video_url || github.event.client_payload.video_id }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          bash scripts/shorts/fetch-source.sh
          T=$(grep -E '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          bash scripts/release-status.sh "$T" run "Découpe en shorts en cours… [suivre](https://github.com/$REPO/actions/runs/${{ github.run_id }})"

      - name: Cache whisper.cpp (repli si Groq indisponible)
        id: whisper-cache
        uses: actions/cache@v5
        with:
          path: whisper.cpp
          key: whispercpp-build-v4-${{ runner.os }}

      - name: Compiler whisper.cpp (si pas en cache)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
          cmake --build whisper.cpp/build -j"$(nproc)" --config Release
          cd whisper.cpp
          bash models/download-ggml-model.sh small
          bash models/download-ggml-model.sh large-v3-turbo-q5_0 || echo "modèle turbo indisponible : whisper small sera utilisé"

      - name: Transcription (Groq par morceaux de 10 min, repli whisper local)
        run: |
          rm -f content/script.txt
          node scripts/transcribe.mjs
        timeout-minutes: 240

      - name: Choisir les meilleurs passages
        env:
          SHORTS_COUNT: ${{ inputs.nombre || '5' }}
          SHORTS_MIN: ${{ inputs.duree_min || '30' }}
          SHORTS_MAX: ${{ inputs.duree_max || '90' }}
          SHORTS_FOCUS: ${{ inputs.consigne }}
        run: node scripts/shorts/select.mjs
        timeout-minutes: 30

      - name: Découper les passages
        id: cut
        env:
          SHORTS_CROP: ${{ inputs.recadrage || 'auto' }}
          SHORTS_CROP_POS: ${{ inputs.position || 'center' }}
        run: |
          python3 scripts/face-box.py input/video.* 80 > shorts/source-face.json 2>/dev/null || echo '{"found":false}' > shorts/source-face.json
          echo "Visage dans la source : $(cat shorts/source-face.json)"
          node scripts/shorts/cut.mjs
          echo "matrix=$(cat shorts/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "lang=$(node -p "require('./shorts/selection.json').lang")" >> "$GITHUB_OUTPUT"
          cp content/transcript.json shorts/source-transcript.json

      - name: Garder la sélection et la transcription
        uses: actions/upload-artifact@v6
        with:
          name: shorts-selection
          path: |
            shorts/selection.json
            shorts/source-transcript.json
            shorts/clip-*/meta.json
          retention-days: 3

      - name: Envoyer chaque passage au rendu
        uses: actions/upload-artifact@v6
        with:
          name: clips
          path: shorts/clip-*/
          retention-days: 1
          compression-level: 0

  # ------------------------------------------------------------------ 2. un job de rendu par short (en parallèle)
  render:
    needs: select
    runs-on: ubuntu-24.04   # figé : ubuntu-latest passe à Ubuntu 26 (oct. 2026), non testé
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Outils (ffmpeg…) — avec cache
        uses: ./.github/actions/setup-media
        with:
          opencv: "true"

      - uses: actions/download-artifact@v7
        with:
          name: clips
          path: shorts

      - name: Préparer le passage ${{ matrix.id }}
        run: |
          D="shorts/clip-${{ matrix.id }}"
          ls -la "$D"
          mkdir -p input content
          rm -f input/video.* content/script.txt content/style.json
          cp "$D/video.mp4" input/video.mp4
          cp "$D/transcript.json" content/transcript.json
          echo vertical > content/orientation.txt
          # où est le visage, et la vidéo a-t-elle déjà des sous-titres incrustés ? (aucun texte ne doit passer dessus)
          python3 scripts/face-box.py input/video.mp4 60 > content/face.json 2>/dev/null || echo '{"found":false}' > content/face.json
          echo "Visage / sous-titres incrustés : $(cat content/face.json)"
          echo "SHORT_STYLE=$(node -p "require('./$D/meta.json').theme")" >> "$GITHUB_ENV"
          echo "KEY_OFFSET=$((10#${{ matrix.id }} - 1))" >> "$GITHUB_ENV"

      - name: Scénario du short (hook, headlines, cartes)
        env:
          NO_MANUAL_HEADLINES: "1"
        run: node scripts/plan-video.mjs
        timeout-minutes: 20

      - name: Emojis
        run: python3 scripts/make-emoji.py content/plan.json

      - name: Rendu du short (identité Shorts, 2e essai en mode sûr si besoin)
        env:
          ID: ${{ matrix.id }}
          # 🔗 chaîne (fond vert / Montage LV final) : « non » au lancement = aucun sous-titre dans les Shorts.
          # Lancement à la main : vide = comportement habituel (inchangé)
          SUBTITLES: ${{ github.event.client_payload.sous_titres == 'non' && 'off' || '' }}
        run: |
          set -o pipefail
          mkdir -p out
          if node scripts/render-short.mjs 2>&1 | tee render.log; then exit 0; fi
          echo "::warning title=Short $ID::1er rendu échoué : $(grep -v '^\s*$' render.log | tail -3 | tr '\n' ' ' | cut -c1-400)"
          if SAFE_MODE=1 node scripts/render-short.mjs 2>&1 | tee render-safe.log; then exit 0; fi
          { echo "1er essai :"; tail -25 render.log; echo; echo "Mode sûr :"; tail -25 render-safe.log; } > "out/short-$ID.error.txt"
          echo "::error title=Short $ID — rendu impossible::$(grep -v '^\s*$' render-safe.log | tail -4 | tr '\n' ' ' | cut -c1-600)"
          exit 1
        timeout-minutes: 80

      - name: Nommer le short
        run: |
          D="shorts/clip-${{ matrix.id }}"
          SLUG=$(node -e "const m=require('./$D/meta.json');const t=(m.title||m.hook||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);process.stdout.write(t||'short')")
          mkdir -p out
          cp output/final.mp4 "out/short-${{ matrix.id }}-${SLUG}.mp4"
          cp content/plan.json "out/short-${{ matrix.id }}.plan.json"
          cp "$D/meta.json" "out/short-${{ matrix.id }}.meta.json"
          ls -la out

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: short-${{ matrix.id }}
          path: out/
          retention-days: 3
          compression-level: 0

  # ------------------------------------------------------------------ 3. dépôt : Release ou Google Drive selon la taille
  publish:
    needs: [select, render]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04   # figé : ubuntu-latest passe à Ubuntu 26 (oct. 2026), non testé
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        continue-on-error: true   # aucun short rendu : publish.sh le signale clairement
        with:
          pattern: short-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: shorts-selection
          path: shorts

      - name: Déposer les shorts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ needs.select.outputs.base }}
          SRC_TAG: ${{ needs.select.outputs.src_tag }}
          DESTINATION: ${{ inputs.destination || 'auto' }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER: ${{ vars.GDRIVE_FOLDER || 'Push-overlay/shorts' }}
          SHORTS_RELEASE_MAX_MB: ${{ vars.SHORTS_RELEASE_MAX_MB || '1900' }}
          RENDER_RESULT: ${{ needs.render.result }}
          CHAINE_ID: ${{ github.event.client_payload.chaine_id }}
          CHAINE_ORIGINE: ${{ github.event.client_payload.origine }}
        run: bash scripts/shorts/publish.sh

      - name: Mémoriser les thèmes utilisés
        continue-on-error: true
        env:
          LANG_CH: ${{ needs.select.outputs.lang }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin "$DEFAULT_BRANCH" && git checkout -q -f -B style-history "origin/$DEFAULT_BRANCH"
            node -e '
              const fs=require("fs"),p="state/style-history.json";fs.mkdirSync("state",{recursive:true});
              let h={};try{h=JSON.parse(fs.readFileSync(p,"utf8"))}catch{}
              const ch=(process.env.LANG_CH==="ar"?"ar":"fr")+"-shorts";
              const used=fs.readdirSync("out").filter(f=>f.endsWith(".meta.json")).sort().map(f=>JSON.parse(fs.readFileSync("out/"+f,"utf8")).theme).filter(Boolean);
              h[ch]=[...(h[ch]||[]),...used].slice(-12);fs.writeFileSync(p,JSON.stringify(h,null,2)+"\n");console.log(ch,"→",h[ch].join(" → "));'
            git add state/style-history.json
            git diff --cached --quiet && { echo "Historique inchangé."; exit 0; }
            git commit -q -m "chore: historique des styles (shorts) [skip ci]"
            git push -q origin "HEAD:$DEFAULT_BRANCH" && exit 0
            sleep $((i * 4))
          done
          echo "⚠ historique non poussé (non bloquant)"

  # ------------------------------------------------------------------ état « ❌ ÉCHEC » sur la release déposée
  signal-failure:
    needs: [select, render, publish]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Signaler l'échec sur la release déposée
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/release-status.sh "${{ needs.select.outputs.src_tag || github.event.release.tag_name }}" fail "La découpe a échoué : [voir le détail](https://github.com/$REPO/actions/runs/${{ github.run_id }})."
