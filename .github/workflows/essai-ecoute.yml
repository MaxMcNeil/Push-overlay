name: Essai écoute radios (temporaire)

# ESSAI TEMPORAIRE sur la branche radios : jamais sur main. Aucune IA, aucun quota.
on:
  push:
    branches: [radios]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrice: ${{ steps.p.outputs.matrice }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - id: p
        run: node scripts/warroom/ecoute/plan.mjs
      - uses: actions/upload-artifact@v6
        with: { name: ecoute-plan, path: output/warroom/ecoute/plan.json, retention-days: 1 }

  ecoute:
    needs: plan
    if: needs.plan.outputs.matrice != '[]' && needs.plan.outputs.matrice != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lot: ${{ fromJSON(needs.plan.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: ecoute-plan, path: output/warroom/ecoute }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - name: Outils
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          pip install -q faster-whisper
      - name: Écoute et transcription
        run: python scripts/warroom/ecoute/transcrire.py output/warroom/ecoute/plan.json ${{ matrix.lot }} output/warroom/ecoute/transcriptions
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: "transcription-${{ matrix.lot }}", path: output/warroom/ecoute/transcriptions, retention-days: 1, if-no-files-found: ignore }

  bilan:
    needs: [plan, ecoute]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with: { pattern: "transcription-*", merge-multiple: true, path: output/warroom/ecoute/transcriptions }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: ls output/warroom/ecoute/transcriptions 2>/dev/null | wc -l; node scripts/warroom/ecoute/radios.mjs output/warroom/ecoute/transcriptions
